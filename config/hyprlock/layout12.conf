################################################################################
# Testeinstieg fuer Layout 12 aus mahaveergurjar/Hyprlock-Dots
#
# Bewusst NICHT ~/.config/hypr/hyprlock.conf -- die eigene dynamic-island-
# Config bleibt unangetastet und weiter der Standard. Zum Ausprobieren:
#
#     hyprlock -c ~/.config/hyprlock/layout12.conf
#
# Ein anderes Layout testen: unten die Zeile auf layoutN.conf umbiegen.
################################################################################

$hyprlockDir = $HOME/.config/hyprlock

# Farbvariablen des Repos ($primary_1, $p1_accent_* ...).
# Layout 12 nutzt sie nicht, andere Layouts schon.
source = $hyprlockDir/colors.conf

# Skript-Variablen, auf die die Layouts per $music, $battery ... zugreifen.
$music    = $hyprlockDir/scripts/playerctlock.sh
$album    = $hyprlockDir/scripts/hlock_mpris.sh
$battery  = $hyprlockDir/scripts/battery.sh
$location = $hyprlockDir/scripts/location.sh
$weather  = $hyprlockDir/scripts/weather.sh

source = $hyprlockDir/layouts/layout12.conf
