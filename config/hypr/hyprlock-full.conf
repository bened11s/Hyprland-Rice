################################################################################
# hyprlock -- Vollbild-Lockscreen (Option 2 der Shell-Einstellung)
#
# Steht neben ~/.config/hypr/hyprlock.conf (Option 1, "karte"). Welche von
# beiden genutzt wird, entscheidet
#
#     ~/.config/hypr/scripts/lock.sh
#
# das die Wahl aus der Shell-Einstellung liest (shell.json, Schluessel
# lock.style, Menue "Sperrbildschirm" im Einstellungs-Fenster).
# Dieselbe Farben-Datei wie beim Karten-Lockscreen, d.h. Uhr, Datum und Text
# wechseln beim Theme-/Wallpaper-Wechsel automatisch mit -- genau wie die QS.
#
# Farben: ~.config/hypr/scheme/hyprlock.conf (von `dynamic-island scheme`
# bzw. `... wallpaper` bei jedem Wechsel neu geschrieben). Fehlt sie, gelten
# die Ersatzfarben darunter.
################################################################################

# Ersatzfarben, falls scheme/hyprlock.conf noch nicht erzeugt wurde.
$background       = rgb(0a0f10)
$surface          = rgb(0a0f10)
$surfaceContainer = rgb(141b1d)
$surfaceBright    = rgb(242e31)
$onBackground     = rgb(dde7eb)
$onSurface        = rgb(dde7eb)
$onSurfaceVariant = rgb(a3adb0)
$outline          = rgb(6d777b)
$outlineVariant   = rgb(40494d)
$primary          = rgb(9fcedd)
$primaryDim       = rgb(91c0cf)
$onPrimary        = rgb(124653)
$secondary        = rgb(b2cad3)
$tertiary         = rgb(d0e0ff)
$error            = rgb(fa746f)
$onError          = rgb(490006)
$surfaceCard      = rgba(0a0f10c0)
$surfaceInner     = rgba(141b1de6)
$outlineSoft      = rgba(6d777b99)
$shadow           = rgba(0000005a)

source = ~/.config/hypr/scheme/hyprlock.conf

################################################################################
# Verhalten -- dieselben Grundregeln wie der Karten-Lockscreen
################################################################################
general {
    hide_cursor        = true
    ignore_empty_input = true
    immediate_render   = true
    text_trim          = true
}

auth {
    # Kein Fingerabdruckleser am Rechner -- spart den Timeout beim Start.
    fingerprint:enabled = false
}

animations {
    enabled = true
    bezier  = snappy, 0.16, 1, 0.3, 1
    animation = fadeIn,  1, 3, snappy
    animation = fadeOut, 1, 3, snappy
    animation = inputFieldDots, 1, 1.6, snappy
}

################################################################################
# Hintergrund: dasselbe Wallpaper wie ueberall sonst, stark unscharf.
# Wechselt ueber den Symlink ~.local/state/dynamic-island/wallpaper/current
################################################################################
background {
    monitor =
    path    = ~/.local/state/dynamic-island/wallpaper/current

    blur_passes       = 5
    blur_size         = 12
    noise             = 0.014
    contrast          = 0.96
    brightness        = 0.44
    vibrancy          = 0.22
    vibrancy_darkness = 0.05
}

################################################################################
# Uhr -- gross, oben zentriert (wie die Vorlage)
################################################################################
label {
    monitor     =
    text        = $TIME
    color       = $primary
    font_size   = 190
    font_family = Fira Sans
    position    = 0, -40
    halign      = center
    valign      = top
}

################################################################################
# Wochentag -- rechts neben der Uhr, leicht tiefer
################################################################################
label {
    monitor     =
    text        = cmd[update:60000] date '+%A'
    color       = $secondary
    font_size   = 46
    font_family = Fira Sans
    position    = -60, -260
    halign      = right
    valign      = top
}

################################################################################
# Datum -- mittig unter der Uhr
################################################################################
label {
    monitor     =
    text        = cmd[update:60000] date '+%B %-d %Y'
    color       = $secondary
    font_size   = 44
    font_family = Fira Sans
    position    = 0, -310
    halign      = center
    valign      = top
}

################################################################################
# Begruessung nach Tageszeit -- deutsch, weil die Shell es auch so macht
################################################################################
label {
    monitor     =
    text        = cmd[update:60000] sh -c 'h=$(date +%H); if [ "$h" -lt 5 ]; then t="Gute Nacht"; elif [ "$h" -lt 11 ]; then t="Guten Morgen"; elif [ "$h" -lt 18 ]; then t="Guten Tag"; else t="Guten Abend"; fi; printf "%s, %s" "$t" "$USER"'
    color       = $primaryDim
    font_size   = 34
    font_family = Fira Sans
    position    = 0, 0
    halign      = center
    valign      = center
}

################################################################################
# Passwortfeld -- wie in der Vorlage unsichtbar, solange nichts getippt wird.
# Tippen blendet es samt Dots ein; Enter entsperrt.
################################################################################
input-field {
    monitor =

    size              = 360, 60
    rounding          = 30
    outline_thickness = 2

    outer_color       = $outlineSoft
    inner_color       = $surfaceInner
    font_color        = $onSurface
    check_color       = $primary
    fail_color        = $error
    capslock_color    = $tertiary
    numlock_color     = -1
    bothlock_color    = $tertiary

    dots_size         = 0.26
    dots_spacing      = 0.32
    dots_center       = true
    dots_rounding     = -1

    fade_on_empty     = true
    invert_numlock    = false
    swap_font_color   = false

    fail_text         = $FAIL  ($ATTEMPTS)

    position          = 0, -150
    halign            = center
    valign            = center
}

################################################################################
# Fusszeile -- verraet, was zu tun ist (das Feld selbst bleibt unsichtbar)
################################################################################
label {
    monitor     =
    text        = Passwort eingeben - Enter entsperrt
    color       = $onSurfaceVariant
    font_size   = 16
    font_family = Fira Sans
    position    = 0, -430
    halign      = center
    valign      = center
}
