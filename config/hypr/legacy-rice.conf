# Uebergang fuer die bereits laufende hyprlang-Sitzung.
# Ab dem naechsten Login wird hyprland.lua statt hyprland.conf verwendet.
env = QT_QPA_PLATFORMTHEME,kde
source = ~/.config/hypr/scheme/current.conf
cursor {
    no_hardware_cursors = true
}
general {
    gaps_in = 5
    gaps_out = 0,10,10,10
    border_size = 1
    col.active_border = rgb($primary)
    col.inactive_border = rgb($outlineVariant)
}
decoration {
    active_opacity = 0.96
    inactive_opacity = 0.90
    rounding = 15
    blur {
        enabled = true
        size = 4
        passes = 2
    }
}
unbind = SUPER, SUPER
unbind = SUPER, SUPER_L
unbind = SUPER, SPACE
unbind = SUPER, Q
unbind = SUPER, W
unbind = SUPER, P
unbind = SUPER, A
unbind = SUPER, N
unbind = SUPER, I
unbind = SUPER, X
unbind = SUPER, C
unbind = SUPER, V
unbind = SUPER, PERIOD
unbind = SUPER SHIFT, S
unbind = SUPER SHIFT, W
bindr = SUPER, SUPER_L, exec, qs -c dynamic-island ipc call launcher toggle
bind = SUPER, SPACE, exec, fuzzel
bind = SUPER, Q, exec, kitty
bind = SUPER, W, exec, opera-gx
bind = SUPER, P, exec, kate
bind = SUPER, C, killactive,
bind = SUPER, A, exec, qs -c dynamic-island ipc call launcher control
bind = SUPER, N, exec, qs -c dynamic-island ipc call launcher notifications
bind = SUPER, I, exec, qs -c dynamic-island ipc call launcher system
bind = SUPER, X, exec, qs -c dynamic-island ipc call launcher power
bind = SUPER, V, exec, dynamic-island clipboard
bind = SUPER, PERIOD, exec, dynamic-island emoji -p
bind = SUPER SHIFT, S, exec, dynamic-island screenshot -r -f
bind = SUPER SHIFT, W, exec, dynamic-island wallpaper -r
source = ~/.config/hypr/legacy-workspaces.conf
