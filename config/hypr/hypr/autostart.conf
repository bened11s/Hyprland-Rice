# ====================================================================
#  autostart.conf - was beim Start von Hyprland mitlaeuft
#  Jede Zeile ist unabhaengig: faellt eines aus, laeuft der Rest.
# ====================================================================

# Passwortabfrage fuer pacman/yay/mount (gleiche wie unter Plasma).
#
# FEHLER, gefunden und behoben am 04.10.2026:
# Hier stand vorher "exec-once = polkit-kde-agent". Das Paket
# polkit-kde-agent ist installiert, aber es gibt KEIN Programm
# dieses Namens - das Binary liegt nicht im PATH:
#     /usr/lib/polkit-kde-authentication-agent-1
# Beleg: pacman -Ql polkit-kde-agent
# Die Zeile startete also nichts, und unter Hyprland waere jedes
# Fenster, das eine Berechtigung braucht (Paket installieren,
# Datentraeger einhaengen, WLAN-Passwort speichern), still
# haengen geblieben - ohne Rueckfrage.
# Die systemd-Unit plasma-polkit-agent.service waere auch nicht
# automatisch gestartet, sie ist "static" und haengt an
# plasma-core.target, was es unter Hyprland nicht gibt.
exec-once = /usr/lib/polkit-kde-authentication-agent-1

# Schluesselbund fuer Dolphin/Discover (Netzwerklaufwerke, WLAN-Passwoerter):
exec-once = kwalletd6

# Benachrichtigungen:
exec-once = mako

# Bildschirm aus nach Idle:
exec-once = hypridle

# Hintergrundbild: macht Autostart.sh mit "swaybg".
# hyprpaper wird hier ABSICHTLICH nicht gestartet - es hat in dieser
# Version ein unbrauchbares Config-Format und wuerde mit swaybg
# um dieselbe Hintergrundebene kaempfen.

# Datei-Dialoge / Bildschirmfreigabe. Die Unit xdg-desktop-portal.service
# startet eigentlich automatisch per D-Bus; der Test ist nur Sicherheit:
exec-once = pgrep -x xdg-desktop-portal >/dev/null 2>&1 || /usr/lib/xdg-desktop-portal

# Statusleiste, Hintergrundbild, Mauszeiger (mit Logdateien):
exec-once = $HOME/.config/hypr/hypr/Autostart.sh

# --- Selbstdiagnose nach dem Start --------------------------------
# 04.10.2026: Der Benutzer sah am 15:32 und 15:34 zweimal eine
# schwarze Oberflaeche. Ich konnte es nicht klaeren, weil ich nur
# Prozesslisten hatte. Diese Diagnose macht jetzt von selbst ein
# Bild je Monitor und schreibt es nach ~/.cache/hypr-diagnose.log.
#
# Sie startet absichtlich NICHT sofort: Hyprland braucht die ersten
# Sekunden fuer Monitoraufbau, Seitepuffer und die Leiste. Ohne
# Verzoegerung wuerde sie genau das messen, was noch nicht fertig
# ist - und schon wieder eine falsche Diagnose liefern.
exec-once = bash -c "sleep 20; $HOME/.config/hypr/hypr/diagnose.sh"