# kitty-Look der Dynamic-Island-Rice.
#
# install.sh legt diese Datei nach ~/.config/kitty/dynamic-island.conf und
# bindet sie am Ende von ~/.config/kitty/kitty.conf ein (markierter Block).
# Eigene Werte NACH diesem Block in kitty.conf gewinnen.
#
# Die Farben kommen nicht von hier: Die Shell schreibt das Farbschema als
# Escape-Sequenzen nach ~/.local/state/dynamic-island/sequences.txt, die
# Shell-Config (fish/bash/zsh) liest sie beim Start ein.

# Durchsichtiger Hintergrund – der Blur kommt von Hyprland
# (decoration.blur mit ignore_opacity in den Profilen).
background_opacity 0.2
