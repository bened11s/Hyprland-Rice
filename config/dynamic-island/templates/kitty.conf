# kitty-Farben aus dem aktuellen Schema.
#
# Vorlage:  ~/.config/dynamic-island/templates/kitty.conf   <- diese Datei
# Erzeugt:  ~/.local/state/dynamic-island/theme/kitty.conf  <- nicht bearbeiten
# Geladen:  ~/.config/kitty/kitty.conf bindet das Ergebnis ein
#
# Die CLI rendert jede Datei in templates/ bei jedem Themenwechsel neu
# (apply_user_templates). Platzhalter sind {{ name.form }}; form ist hex,
# hexalpha, rgb oder rgbalpha. Die Namen stehen in
# ~/.local/state/dynamic-island/scheme.json.
#
# Laufende kitty-Fenster faerbt die CLI ohnehin sofort per OSC-Sequenz um
# (theme.enableTerm in cli.json); diese Datei ist fuer alle Fenster, die
# danach neu aufgehen.

foreground            #{{ onSurface.hex }}
background            #{{ surface.hex }}

selection_foreground  #{{ onSecondary.hex }}
selection_background  #{{ secondary.hex }}

cursor                #{{ secondary.hex }}
cursor_text_color     #{{ surface.hex }}

url_color             #{{ primary.hex }}

# Raender zwischen den Splits
active_border_color   #{{ primary.hex }}
inactive_border_color #{{ outline.hex }}
bell_border_color     #{{ error.hex }}

# Tab-Leiste
active_tab_foreground   #{{ onPrimary.hex }}
active_tab_background   #{{ primary.hex }}
inactive_tab_foreground #{{ onSurfaceVariant.hex }}
inactive_tab_background #{{ surfaceContainer.hex }}
tab_bar_background      #{{ surfaceContainerLowest.hex }}

# Die 16 ANSI-Farben – dieselben, die auch als OSC-Sequenz rausgehen
color0  #{{ term0.hex }}
color1  #{{ term1.hex }}
color2  #{{ term2.hex }}
color3  #{{ term3.hex }}
color4  #{{ term4.hex }}
color5  #{{ term5.hex }}
color6  #{{ term6.hex }}
color7  #{{ term7.hex }}
color8  #{{ term8.hex }}
color9  #{{ term9.hex }}
color10 #{{ term10.hex }}
color11 #{{ term11.hex }}
color12 #{{ term12.hex }}
color13 #{{ term13.hex }}
color14 #{{ term14.hex }}
color15 #{{ term15.hex }}
