[package]
name = "dynamic-island-cli"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "dynamic-island-rs"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", default-features = false, features = ["std", "derive", "error-context"] }
di-common = { path = "../common" }
flate2 = "1"
imagesize = "0.14"
libc.workspace = true
serde_json.workspace = true
tar = { version = "0.4", default-features = false }
tempfile.workspace = true
