[workspace]
resolver = "3"
members = ["idle-helper", "bluetooth-agent", "common", "cli", "looks"]

[workspace.package]
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[workspace.dependencies]
futures-util = { version = "0.3", default-features = false }
libc = "0.2"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt", "signal", "sync", "time"] }
zbus = { version = "6", default-features = false, features = ["proxy", "service", "tokio"] }

[profile.release]
opt-level = "s"
strip = true
lto = true
codegen-units = 1
panic = "unwind"
