# Farben fuer hyprlock -- erzeugt von `dynamic-island scheme` / `... wallpaper`.
# NICHT von Hand bearbeiten, die Datei wird bei jedem Themewechsel neu
# geschrieben. Das Layout steht in ~/.config/hypr/hyprlock.conf und holt sich
# diese Datei per `source`.

# Flaechen
$background          = rgb({{ $background }})
$surface             = rgb({{ $surface }})
$surfaceContainer    = rgb({{ $surfaceContainer }})
$surfaceBright       = rgb({{ $surfaceBright }})

# Schrift auf den Flaechen
$onBackground        = rgb({{ $onBackground }})
$onSurface           = rgb({{ $onSurface }})
$onSurfaceVariant    = rgb({{ $onSurfaceVariant }})

# Linien
$outline             = rgb({{ $outline }})
$outlineVariant      = rgb({{ $outlineVariant }})

# Akzente
$primary             = rgb({{ $primary }})
$primaryDim          = rgb({{ $primaryDim }})
$onPrimary           = rgb({{ $onPrimary }})
$secondary           = rgb({{ $secondary }})
$tertiary            = rgb({{ $tertiary }})
$error               = rgb({{ $error }})
$onError             = rgb({{ $onError }})

# Halbtransparente Varianten fuer Karte und Eingabefeld
$surfaceCard         = rgba({{ $surface }}c0)
$surfaceInner        = rgba({{ $surfaceContainer }}e6)
$outlineSoft         = rgba({{ $outlineVariant }}99)
$shadow              = rgba(0000005a)
