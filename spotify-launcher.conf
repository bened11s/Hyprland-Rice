[spotify]
# Spotify laeuft via XWayland, aber Mesa-EGL im GPU-Prozess folgt WAYLAND_DISPLAY
# -> segfault in wl_proxy_create_wrapper; nach 3 Crashes faellt Chromium auf
# Software-Rendering zurueck (--use-gl=disabled) und die UI laggt.
# EGL_PLATFORM=x11 hilft nicht, nur WAYLAND_DISPLAY leeren.
extra_env_vars = ["WAYLAND_DISPLAY="]
