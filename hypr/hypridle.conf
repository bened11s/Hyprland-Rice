# In allen Hyprland-Profilen: bei Inaktivitaet sperren und die Displays abschalten.
# Anwendungen mit Idle-Inhibitor (z. B. Videos/Spiele) duerfen das verhindern.
general {
    # Stil liest hyprlock-select aus shell.json (lockscreen.style),
    # damit auch der Idle-Lock dieselbe Wahl wie SUPER+L trifft.
    lock_cmd = pidof hyprlock || $HOME/.local/bin/hyprlock-select
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 180
    on-timeout = loginctl lock-session
}

listener {
    timeout = 240
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
