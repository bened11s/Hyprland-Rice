################################################################################
# hyprlock -- Sperrbildschirm im Stil der dynamic-island-Shell
#
# Liegt am Standardpfad (~/.config/hypr/hyprlock.conf), deshalb reicht der
# nackte Aufruf `hyprlock`, ohne -c.
#
# Die Farben kommen aus scheme/hyprlock.conf. Die Datei schreibt die CLI bei
# jedem Theme- oder Wallpaper-Wechsel neu (theme.py -> apply_hyprlock), der
# Lockscreen traegt also immer die Farben des aktuellen Hintergrunds.
# Fehlt sie, faellt alles auf die Ersatzfarben unten zurueck.
#
# Der Hintergrund ist derselbe Symlink, auf den auch die Shell zeigt:
# ~/.local/state/dynamic-island/wallpaper/current
################################################################################

# Ersatzfarben, falls scheme/hyprlock.conf noch nicht erzeugt wurde.
# `source` ueberschreibt sie anschliessend.
$background       = rgb(0a0f10)
$surface          = rgb(0a0f10)
$surfaceContainer = rgb(141b1d)
$surfaceBright    = rgb(242e31)
$onBackground     = rgb(dde7eb)
$onSurface        = rgb(dde7eb)
$onSurfaceVariant = rgb(a3adb0)
$outline          = rgb(6d777b)
$outlineVariant   = rgb(40494d)
$primary          = rgb(9fcedd)
$primaryDim       = rgb(91c0cf)
$onPrimary        = rgb(124653)
$secondary        = rgb(b2cad3)
$tertiary         = rgb(d0e0ff)
$error            = rgb(fa746f)
$onError          = rgb(490006)
$surfaceCard      = rgba(0a0f10c0)
$surfaceInner     = rgba(141b1de6)
$outlineSoft      = rgba(40494d99)
$shadow           = rgba(0000005a)

source = ~/.config/hypr/scheme/hyprlock.conf

################################################################################
# Verhalten
################################################################################

general {
    hide_cursor        = true
    ignore_empty_input = true
    immediate_render   = true
    text_trim          = true
}

auth {
    # Kein Fingerabdruckleser am Rechner -- spart den Timeout beim Start.
    fingerprint:enabled = false
}

animations {
    enabled = true
    bezier  = snappy, 0.16, 1, 0.3, 1
    animation = fadeIn,  1, 3, snappy
    animation = fadeOut, 1, 3, snappy
    animation = inputFieldDots, 1, 1.6, snappy
}

################################################################################
# Hintergrund: das aktuelle Wallpaper, unscharf und abgedunkelt
################################################################################

background {
    monitor =
    path    = ~/.local/state/dynamic-island/wallpaper/current

    blur_passes       = 3
    blur_size         = 8
    noise             = 0.012
    contrast          = 0.95
    brightness        = 0.42
    vibrancy          = 0.18
    vibrancy_darkness = 0.05
}

################################################################################
# Karte -- dieselbe Pillen-Optik wie die Settings-Karte der Bar
################################################################################

shape {
    monitor      =
    size         = 430, 560
    color        = $surfaceCard
    rounding     = 34
    border_size  = 1
    border_color = $outlineSoft
    position     = 0, 0
    halign       = center
    valign       = center
}

################################################################################
# Avatar (~/.face), Name, Uhr, Datum
################################################################################

# rounding = -1 macht daraus einen Kreis
image {
    monitor      =
    path         = ~/.face
    size         = 132
    rounding     = -1
    border_size  = 3
    border_color = $primary
    position     = 0, 175
    halign       = center
    valign       = center
}

label {
    monitor    =
    text       = $USER
    color      = $onSurfaceVariant
    font_size  = 15
    font_family = JetBrainsMono NF Medium
    position   = 0, 82
    halign     = center
    valign     = center
}

label {
    monitor     =
    text        = $TIME
    color       = $onBackground
    font_size   = 62
    font_family = JetBrainsMono NF ExtraBold
    position    = 0, 18
    halign      = center
    valign      = center
}

label {
    monitor     =
    text        = cmd[update:30000] date '+%A, %-d. %B'
    color       = $primary
    font_size   = 14
    font_family = JetBrainsMono NF Medium
    position    = 0, -38
    halign      = center
    valign      = center
}

################################################################################
# Passwortfeld
################################################################################

input-field {
    monitor =

    size              = 310, 56
    rounding          = 28
    outline_thickness = 2

    outer_color       = $outlineSoft
    inner_color       = $surfaceInner
    font_color        = $onSurface
    check_color       = $primary
    fail_color        = $error
    capslock_color    = $tertiary
    numlock_color     = -1
    bothlock_color    = $tertiary

    dots_size         = 0.26
    dots_spacing      = 0.32
    dots_center       = true
    dots_rounding     = -1

    fade_on_empty     = false
    invert_numlock    = false
    swap_font_color   = false

    placeholder_text  = Passwort
    fail_text         = $FAIL  ($ATTEMPTS)

    position          = 0, -140
    halign            = center
    valign            = center
}

################################################################################
# Fusszeile -- bei aktiver Feststelltaste faerbt sich ausserdem der Rand des
# Eingabefelds (capslock_color), das ist der eigentliche Hinweis.
################################################################################

label {
    monitor     =
    text        = Enter zum Entsperren
    color       = $onSurfaceVariant
    font_size   = 11
    font_family = JetBrainsMono NF
    position    = 0, -205
    halign      = center
    valign      = center
}
