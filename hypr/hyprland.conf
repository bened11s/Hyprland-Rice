# ====================================================================
#  HYPRLAND 0.56.2  ·  Tokyo Night  ·  eingerichtet von Nox am 03.10.2026
# ====================================================================
#  Diese Datei ist der Einstieg. Plasmalogin startet Hyprland damit.
#  Sie aendert NICHTS an KDE Plasma - Plasma laeuft weiter ueber
#  plasma.desktop, diese Datei wird davon nicht gelesen.
# ====================================================================

# --- UMGEBUNG ------------------------------------------------------
# Qt-Apps nativ auf Wayland (nicht ueber XWayland):
env = QT_QPA_PLATFORM,wayland
# Qt soll seine eigene Skalierung machen, Hyprland macht das auch:
env = QT_AUTO_SCREEN_SCALE_FACTOR,0
env = QT_ENABLE_HIGHDPI_SCALING,0
# Electron-Apps (Discord, Spotify) -> Wayland bevorzugen:
env = ELECTRON_OZONE_PLATFORM_HINT,auto
# Firefox / Mozilla:
env = MOZ_ENABLE_WAYLAND,1
env = MOZ_DBUS_REMOTE,1
# Mauszeiger: derselbe wie unter Plasma (global in GTK gesetzt):
env = XCURSOR_THEME,WhiteSur-cursors
env = XCURSOR_SIZE,24

# --- GPU-ZUWEISUNG (wichtig auf diesem Laptop!) --------------------
# Gemessen am 04.10.2026 direkt aus sysfs - frueher war hier eine
# FALSCHE Zuordnung notiert, deshalb nochmal genau:
#
#   card0 = evdi    -> DVI-I-1   Samsung C24F390  (USB/DisplayLink)
#   card1 = nvidia  -> HDMI-A-1  ASUS VG249Q3R 180 Hz (01:00.0)
#   card2 = amdgpu  -> eDP-1     internes Laptop-Panel (05:00.0)
#   card3 = evdi    -> DVI-I-2   HP Z24n G2     (USB/DisplayLink)
#
# Der Hauptmonitor haengt an der NVIDIA-Karte, das Laptop-Panel an der
# AMD-Karte. Wer nur eine Karte waehlt, verliert also immer einen
# Bildschirm.
#
# 04.10.2026, 09:35 - URSACHE GEFUNDEN und BEHOBEN.
# Die Zeile "env = AQ_DRM_DEVICES,card2" liest aquamarine als PFAD,
# nicht als Geraetenamen. Beleg aus dem Coredump (Core vom 09:22,
# mit genau dieser Zeile):
#     ERR ]: drm: Failed to canonicalize path card2
#     ERR ]: drm: Found no gpus to use, cannot continue
#     CRIT ]: Critical error thrown: CBackend::create() failed!
#     CRIT ]: m_pAqBackend couldn't start!
# "canonicalize" ist ein Dateisystem-Befehl - an "card2" scheitert
# er, also findet aquamarine KEINE GPU und bricht den Start ab.
# Genau das war der Absturz um 08:59 (card1,card2) und um 09:22
# (card2) - beide Male dieselbe Stelle, Hyprland+0x1bca07.
#
# LOESUNG: Die Zeile vorerst ganz entfernt. Dann sucht aquamarine
# selbst nach allen Karten - das war der Zustand um 00:13, und da
# lief Hyprland. (Es bleibt eine RenderNode-Warnung fuer die beiden
# evdi-Karten, die ist nicht schlimm.)
#
# Falls wir spaeter wirklich einschraenken wollen, dann mit
# VOLLEN PFADEN, nicht mit Namen:
#   env = AQ_DRM_DEVICES,/dev/dri/card2
# (ungetestet, nur aus dem Log abgeleitet)
#
# Ohne diese Zeile nimmt aquamarine alle Karten:
#   card0 evdi    -> DVI-I-1  (DisplayLink, kein Rendering)
#   card1 nvidia  -> HDMI-A-1 (Hauptmonitor ASUS)
#   card2 amdgpu  -> eDP-1    (Laptop-Panel)
#   card3 evdi    -> DVI-I-2  (DisplayLink, kein Rendering)
#
# Es werden hier KEINE NVIDIA-Prime-Variablen gesetzt (kein
# __NV_PRIME_RENDER_OFFLOAD, kein VK_LOADER_DRIVERS_SELECT). Mit
# solchen Umleitungsvariablen stuerzt die Bilduebertragung an den
# Compositor ab - genau der Fehler, der bei Gamescope diagnostiziert
# wurde (siehe Kursbuch Abschnitt 3).

# --- MONITORE ------------------------------------------------------
# 04.10.2026, 13:40 - ERSTER ERFOLGREICHER START, Werte eingetragen.
# Bis dahin stand hier nur "monitor=,preferred,auto,1". Das heisst
# "bevorzugter Modus" - und Hyprland hat dabei HDMI-A-1 auf 60 Hz
# gesetzt, obwohl der ASUS VG249Q3R 180 Hz kann. Unter Plasma laeuft
# derselbe Monitor auf 180,06 Hz (aus ~/.config/kwinoutputconfig.json,
# refreshRate 180061 mHz = 180,061 Hz). Das war eine echte
# Abweichung von "komplett gleich".
#
# Deshalb jetzt pro Monitor eine eigene Zeile mit dem Modus, den
# Plasma auch benutzt:
#
#   eDP-1    Laptop-Panel          1920x1080 @ 60,01   (Maximum des Panels)
#   HDMI-A-1 ASUS VG249Q3R         1920x1080 @ 180,06  (war 60 -> behoben)
#   DVI-I-1  Samsung C24F390       1920x1080 @ 60,01   (Maximum, s. Frage unten)
#   DVI-I-2  HP Z24n G2            1920x1200 @ 59,95   (Maximum)
#
# "auto" fuer die Position: die Anordnung macht Hyprland dann selbst,
# von links nach rechts in dieser Reihenfolge - so kam es auch ohne
# diese Zeilen heraus. Fest verdrahtete Positionen waeren nur
# scheinbar genauer, wuerden aber beim Ausstecken eines Monitors
# die uebrigen verschieben.
#
# Offene Frage an dich: In der Plasma-Konfiguration steht DVI-I-1
# (Samsung) auf 1024x600 @ 59,82 Hz, nicht auf 1920x1080. Das ist
# der gespeicherte Plasma-Stand, aber es wirkt wie ein Versehen -
# der C24F390 ist ein 1920x1080-Geraet, und 1024x600 bei 60 Hz
# bringt keinen Geschwindigkeitsvorteil. Ich habe deshalb hier das
# Maximum genommen. Sag Bescheid, wenn du es wirklich auf 1024x600
# haben willst, dann stelle ich es um.
monitor=eDP-1,1920x1080@60,auto,1
# HDMI wird wechselnd am ASUS-Monitor und am Sony-TV benutzt.
# Keine 180 Hz auf dem 60-Hz-TV erzwingen.
monitor=HDMI-A-1,highres,auto,1
# 04.10.2026, Nox: stand hier vorher "highres". "highres" heisst
# "nimm den hoechsten Modus, den der Monitor meldet" - das ist bei
# einem DisplayLink-Adapter nicht stabil: was heute 1920x1080 ist,
# kann morgen etwas anderes sein, und niemand kann sagen, warum.
# Der Monitor bekam am 04.10. ohnehin 1920x1080@60.00. Jetzt steht
# der Modus fest. Das ist Ordnung, keine Fehlerbehebung - der
# schwarze Bildschirm kam von hyprlock, nicht von hier.
monitor=DVI-I-1,1920x1080@60.00,auto,1
monitor=DVI-I-2,1920x1200@59.95,auto,1

# --- STARTBILD ------------------------------------------------------
# 04.10.2026, Nox: Hyprland blendet beim Start kurz sein eigenes Logo
# ein, bis der Hintergrundbild-Daemon laeuft. Das ist ein zusaetzlicher
# Blit auf jedem Monitor. Bei dieser Grafiklage (DisplayLink ohne
# Render-Node) ist jeder ueberfluessige Blit einer zusaetzliche
# Fehlerquelle. Das Logo sieht man unter einer Sekunde - weg damit.
disable_hyprland_logo = true

# --- TEILKONFIGURATIONEN ------------------------------------------
source = ~/.config/hypr/hypr/theme.conf
source = ~/.config/hypr/hypr/input.conf
source = ~/.config/hypr/hypr/window.conf
source = ~/.config/hypr/hypr/binds.conf
source = ~/.config/hypr/hypr/autostart.conf
source = ~/.config/hypr/legacy-rice.conf
