# ====================================================================
#  theme.conf - Farben, Rahmen, Animationen
#  Angepasst an Hyprland 0.56 (Nox, 04.10.2026)
#
#  Farbwerte stammen aus DEINER Konsole-Konfiguration
#  (~/.local/share/konsole/TokyoNight.colorscheme), damit alles
#  zusammenpasst:
#    Hintergrund #1a1b26   Text #d7dae0
#    Blau #7aa2f7           Rot #f7768e
#    Gruen #9ece6a          Gelb #e0af68
#    Violett #bb9af7        Cyan #7dcfff
# ====================================================================

general {
    gaps_in = 6
    gaps_out = 10
    border_size = 2
    resize_on_border = true
    layout = dwindle
    allow_tearing = false

    # Fensterrand (in 0.56 unter general, nicht unter decoration)
    # OHNE Leerzeichen in rgba(), sonst lehnt Hyprland die Zeile ab.
    col.active_border = rgba(125,207,255,0.85)
    col.inactive_border = rgba(65,72,104,0.70)

    # Halbes Fenster-Schnappen (Super + Pfeiltasten)
    snap {
        enabled = true
        window_gap = 10
        monitor_gap = 40
        respect_gaps = true
    }
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.94
    fullscreen_opacity = 1.0
    dim_inactive = false
    border_part_of_window = true

    # Schattenwurf (in 0.56 ein eigener Block)
    shadow {
        enabled = true
        range = 12
        render_power = 3
        scale = 1
        sharp = 0
        offset = 0, 0
        color = rgba(0,0,0,0.45)
        color_inactive = rgba(0,0,0,0.30)
    }
}

animations {
    enabled = yes

    # Eigene Kurve. WICHTIG: die eingebauten Namen wie "easeOutCubic"
    # sind in 0.56 nicht mehr gültig, eine selbst definierte Kurve
    # schon. 4 Zahlen = x1,y1,x2,y2.
    bezier = tokyoEase, 0.05, 0.9, 0.1, 1.0
    bezier = tokyoSmooth, 0.4, 0.0, 0.2, 1.0

    # Syntax: Blatt, Art, Groesse, Kurve, Stil
    animation = global, 1, 5, tokyoEase
    animation = windows, 1, 5, tokyoEase, popin 90%
    animation = workspaces, slide, 1, 5, tokyoEase, fade per-monitor
    animation = border, 1, 5, tokyoSmooth
    animation = layersIn, 1, 4, tokyoSmooth, fade
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = -1
    focus_on_activate = true
    key_press_enables_dpms = true
    vrr = 0
}

cursor {
    # Auf der AMD-iGPU sind Hardware-Cursor problemlos moeglich.
    no_hardware_cursors = false
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

xwayland {
    # Alte Apps (Spiele, Electron) brauchen XWayland. Feste Groesse,
    # damit nichts unscharf skaliert wird.
    enabled = true
    force_zero_scaling = true
}

debug {
    disable_logs = false
    suppress_errors = false
    overlay = false
}