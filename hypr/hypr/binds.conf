# ====================================================================
#  binds.conf - Tastenkuerzel
#  Angepasst an Hyprland 0.56 (Nox, 03./04.10.2026)
#
#  WICHTIG - Syntax in 0.56:
#      bind  = MODIFIKATOR, TASTE, DISPATCHER, ARGUMENT   (4 Felder)
#      binde = wie bind, fuer sich wiederholende Tasten
#      bindm = MODIFIKATOR, MAUSTASTE, DISPATCHER          (3 Felder)
#
#  Die blanke Taste (nur Super, kein Buchstabe) bindet man, indem man
#  sie selbst als Taste eintraegt:
#      bind = SUPER, SUPER, exec, rofi -show drun
#
#  Zwei Modifikatoren werden mit Leerzeichen geschrieben:
#      bind = SUPER SHIFT, Q, exit,
#
#  REGEL: Keine Taste darf zweimal belegt sein. Hyprland entscheidet
#  dann still nach Lade-Reihenfolge - man merkt es erst, wenn die
#  falsche Funktion kommt. Mit "SUPER SHIFT, W" waren zum Beispiel
#  gleichzeitig resizeactive UND der Hintergrundbild-Befehl gebunden.
#
#  Primaere Taste = Super (Windows)
# ====================================================================

# --- Programmstarter (rofi) ----------------------------------------
# 06.10.2026 - KORREKTUR durch Nox. Die Fassung vom 04.10. war falsch.
#
# DAMALS: Superallein startete "rofi -show menu".
# WAS DAVON PASSIERTE: "menu" ist in rofi 2.0 KEIN Modus. Beleg:
#     rofi -no-config -dump-config | grep modes
#     -> /*  modes: "window,drun,run,ssh";*/
# Statt einer Programmliste zeigte rofi deshalb einen Fehlerdialog:
#     The following errors were detected when starting rofi:
#     Mode menu is not found.
#     The following modes are known: window, windowcd, run, ssh, drun,
#     combi, Keys, filebrowser, recursivebrowser
# Genau das waren die "verschiedenen errors" vom 06.10. - und
# zugleich der Grund, warum "wichtige apps fehlen": der Dialog
# ersetzte die komplette Liste.
#
# Der alte Kommentar behauptete, rofis Standard enthielte "menu".
# Das stammte aus einem "rofi -dump-config" OHNE "-no-config", der
# unsere eigene Zeile zurueckgespiegelt hat. Zirkelbeweis, keiner.
# Die ausfuehrliche Evidenz steht in ~/.config/rofi/config.rasi.
#
# JETZT: Superallein = Programmliste (drun), wie unter Plasma.
bind = SUPER,        SUPER,  exec, rofi -show drun
bind = SUPER,        SPACE,  exec, rofi -show drun
bind = SUPER SHIFT,  SUPER,  exec, rofi -show window
bind = SUPER CTRL,   SUPER,  exec, rofi -show run

# --- Rechtsklick auf dem Desktop ------------------------------------
# ACHTUNG, empirical ermittelt am 04.10.2026 (siehe Kursbuch 13.7):
# In Hyprland 0.56 ist bindm auf GENAU DREI Felder beschraenkt und
# nimmt KEIN Argument:
#     bindm = MOD, TASTE, DISPATCHER
# Ein "bindm = SUPER, button:3, exec, wofi --show menu" lehnt Hyprland
# mit "bind: too many args" ab. bindm ist fuer durchgehaltene
# Mausbewegungen gedacht (movewindow usw.), nicht fuer einmalige
# Befehle. Fuer einen Rechtsklick-Befehl ist bind richtig:
#     bind  = MOD, TASTE, DISPATCHER, ARGUMENT
# Beide Formen wurden gegen die echte Config geprueft, bevor ich sie
# uebernommen habe - nicht geraten.
#
# 06.10.2026 KORREKTUR (Nox): "wofi --show menu" existiert nicht.
# wofi(7) kennt genau drei Modi: run, drun, dmenu. Der alte Aufruf
# brachte statt eines Menues nur:
#     I would love to show menu but Idk what it is
# Mit "drun" liest wofi dieselben .desktop-Dateien wie rofi und zeigt
# die Programmliste - das entspricht dem Rechtsklick-Menue unter
# Plasma. Fehlt wofi noch, passiert beim Rechtsklick nichts.
# Linux-Eingabecode 273 = rechte Maustaste. Ohne Super bleibt
# der normale Rechtsklick in Anwendungen erhalten. Shift vermeidet
# eine Kollision mit Super+Rechtsziehen (Fenstergroesse).
bind = SUPER SHIFT, mouse:273, exec, wofi --show drun

# --- Terminal und Dateien ------------------------------------------
bind = SUPER, RETURN, exec, kitty
bind = SUPER, E, exec, dolphin

# --- Rofi-Cache leeren (Fluchtweg) ---------------------------------
# 06.10.2026 KORREKTUR (Nox): Der Cache war nie der Engpass. Gemessen
# wurden 0,54 Sekunden bis die Programmliste steht - mit AUSgeschal-
# tetem Cache, also beim Einlesen aller .desktop-Dateien. Deshalb steht
# in ~/.config/rofi/config.rasi jetzt "drun-use-desktop-cache: false".
#
# Auch der alte Dateiname war falsch: rofi hiess die Datei nicht
# "rofi-drun-desktop.cache", sondern "rofi3.druncache" (14 Byte, ein
# einziger Eintrag "0 mpv.desktop" - gerade die halbe Liste, die Apps
# verschwinden laesst).
#
# Die Taste bleibt als Fluchtweg und raeumt jetzt beide Namen weg:
# Programm installiert, Super+Strg+Shift+D, dann ist es da.
bind = SUPER CTRL SHIFT, D, exec, rm -f $HOME/.cache/rofi-drun-desktop.cache $HOME/.cache/rofi3.druncache
# Pfeiltasten statt H/J/K/L, weil Super+L den Sperrbildschirm
# aufruft. H/J/K/L sind weiterhin fuer die Fenstergroesse belegt.
bind = SUPER, LEFT,  movefocus, l
bind = SUPER, RIGHT, movefocus, r
bind = SUPER, UP,    movefocus, u
bind = SUPER, DOWN,  movefocus, d

# --- Alt+Tab: Fenster wechseln (wie unter Plasma) -------------------
# 04.10.2026: FEHLTE BISHER. Unter Plasma ist Alt+Tab selbstverstaendlich,
# unter Hyprland gab es ueberhaupt keine Fensterumschaltung.
#
# Warum kein "richtiges" Alt+Tab: Hyprland 0.56 hat keinen eingebauten
# Umschalter. Im Binary gibt es weder "windowselection" noch "switcher"
# noch "alttab", und das Paket hyprland liefert auch kein passendes
# Binary (nur Hyprland, hyprctl, hyprland, start-hyprland). In den
# CachyOS-Repos und im AUR liegt auch kein Starter dazu.
# Die uebliche Loesung waere ein externes Werkzeug, das eine eigene
# Oberflaeche aufmacht und den Reihenfolgestand selbst haelt.
#
# Was wir nehmen: rofi hat die Fensterliste schon an Bord
# (Super+Shift+Super zeigt sie ebenfalls). Also binden wir Alt+Tab
# darauf. Das ist kein Halten-und-Loslassen-Wechsel wie unter Plasma,
# sondern eine Liste, die sich beim Tastendruck oeffnet - vom Nutzen her
# dasselbe: ein Fenster waehlen, fertig.
#
# Bedienung: Alt+Tab -> Fensterliste, Enter bestaetigt, Escape bricht ab.
bind = ALT, Tab, exec, rofi -show window
bind = ALT SHIFT, Tab, exec, rofi -show window

# --- Fenster verschieben -------------------------------------------
bind = SUPER SHIFT, LEFT,  movewindow, l
bind = SUPER SHIFT, RIGHT, movewindow, r
bind = SUPER SHIFT, UP,    movewindow, u
bind = SUPER SHIFT, DOWN,  movewindow, d

# --- Fenster mit der Maus ziehen (Super + linke/rechte Taste) -----
# bindm hat nur DREI Felder und braucht kein Argument.
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# --- Fenstergroesse (vim-Stil: H/J/K/L) ---------------------------
#   H = schmaler, L = breiter, K = hoeher, J = niedriger
bind = SUPER SHIFT, H, resizeactive, -40 0
bind = SUPER SHIFT, L, resizeactive, 40 0
bind = SUPER SHIFT, K, resizeactive, 0 40
bind = SUPER SHIFT, J, resizeactive, 0 -40
bind = SUPER SHIFT, R, moveactive, -40 0

# --- Fenster: schweben / Vollbild / Gruppe ------------------------
bind = SUPER, P, pseudo,
bind = SUPER, F, fullscreen, 0
bind = SUPER, V, togglefloating,
bind = SUPER SHIFT, V, togglegroup,

# --- Arbeitsflaechen ------------------------------------------------
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# --- Streuarbeitsflaeche fuer Schnellkram --------------------------
# Super + S blendet sie ein/aus, Super + Shift + S wirft das aktive
# Fenster hinein.
# WICHTIG: frueher stand hier "code:42" - das ist die Taste von "foot".
# Foot ist nicht installiert, die Taste tat also nichts. "name:scratch"
# braucht kein bestimmtes Programm.
bind = SUPER, S, togglespecialworkspace, scratch
bind = SUPER SHIFT, S, movetoworkspacesilent, special:scratch

# --- Bildschirmfotos ------------------------------------------------
# Druck ohne Taste = ganzer Bildschirm (grim nimmt alle Monitore)
# Umschalt + Druck = Bereich auswaehlen
# Strg + Druck = Farbe auswaehlen
#
# 04.10.2026: "~" durch "$HOME" ersetzt. Die Tilde ist als Quelle
# in "source =" bewiesen (Test: eine Testdatei mit absichtlichem
# Fehler unter ~ wurde beim Pruefen der Config korrekt gefunden).
# Fuer "exec" ist die Tilde dagegen UNBEWIESEN - das laesst sich
# nur im laufenden Hyprland testen. "$HOME" wird nachweislich
# ersetzt, deshalb die sichere Form. Gleiches gilt fuer die
# Skriptaufrufe weiter unten.
bind = , PRINT, exec, $HOME/.config/hypr/hypr/screenshot.sh full
bind = SHIFT, PRINT, exec, $HOME/.config/hypr/hypr/screenshot.sh area
bind = CTRL, PRINT, exec, hyprpicker

# --- Ton und Medien -------------------------------------------------
binde = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binde = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle
binde = , XF86AudioPlay, exec, playerctl play-pause
binde = , XF86AudioStop, exec, playerctl stop
binde = , XF86AudioNext, exec, playerctl next
binde = , XF86AudioPrev, exec, playerctl previous

# --- Helligkeit ------------------------------------------------------
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# --- Hintergrundbild ------------------------------------------------
# Super + Shift + B laedt das Bild neu, ohne Hyprland neu zu starten.
# Fuer ein anderes Bild einfach das Argument anpassen:
#   bind = SUPER SHIFT, B, exec, $HOME/.config/hypr/hypr/wallpaper.sh ~/Bilder/x.jpg
bind = SUPER SHIFT, B, exec, $HOME/.config/hypr/hypr/wallpaper.sh

# --- Sperren und Abmelden -------------------------------------------
# Super + L sperrt (wie unter Plasma). Super + Shift + Q meldet ab und
# landet wieder im Plasma-Login (plasmalogin), wo Plasma zur Wahl steht.
bind = SUPER, L, exec, hyprlock
bind = SUPER SHIFT, Q, exit,

# --- Selbstpruefung (Nox, 04.10.2026) -------------------------------
# Diese beiden Tests sind absichtlich NICHT im Autostart. Der Starter-
# Test oeffnet acht Fenster und stiehlt achtmal den Fokus - das gehoert
# nicht in jeden Sitzungsstart, sondern auf einen bewussten Tastendruck.
#
#   SUPER+UMSCHALT+F1   Starter-Test: ist das Menue sichtbar?
#                       Ergebnis: ~/.cache/hypr-selftest.log
#   SUPER+UMSCHALT+F2   Bildbefund je Monitor (nur Bild, kein Test)
#                       Ergebnis: ~/.cache/hypr-diagnose.log
bind = SUPER SHIFT, F1, exec, $HOME/.config/hypr/hypr/selftest.sh
bind = SUPER SHIFT, F2, exec, $HOME/.config/hypr/hypr/diagnose.sh

# --- Mikrofone stummschalten (End) ----------------------------------
# 20.10.2026 (Nox): Ein Tastendruck schaltet ALLE angeschlossenen
# Mikrofone stumm; nochmal druecken bringt alle wieder zurueck.
#
# Warum nicht wie die Medientaste oben mit @DEFAULT_SOURCE@: die gilt
# nur fuer die EINZELNE Standardquelle. Uebrig bleibt dann z.B. das
# Laptopmikro weiterhin hoerbar - ebenso jedes zweite USB-Mikro.
# Das Skript schaltet deshalb jede Quelle ausser Monitor-Ausgaengen,
# und zwar systemweit, also auch fuer Discord. Feedback: Benachrichti-
# gung "Alle Mikrofone stumm" bzw. "... an".
bind = , End, exec, $HOME/.local/bin/mic-mute
