# ====================================================================
#  window.conf - Sonderregeln fuer einzelne Fenster
#  Angepasst an Hyprland 0.56 (Nox, 04.10.2026)
#
#  Syntax in 0.56:  windowrule = <Effekt> <Bedingungen>
#  Wichtig: zwischen Effekt und Bedingung steht KEIN Komma.
#
#  In 0.56 vorhandene Effekte (empirisch geprueft):
#    float, fullscreen, maximize, workspace, pin, center,
#    animation, border_color, rounding
# ====================================================================

# --- Kleine Werkzeugfenster immer schweben ------------------------
# Diese Fenster sollen nicht ueber die halbe Bildschirmbreite
# hinausgedehnt werden (Super + Pfeil snapped sonst).
windowrule = float match:class ^(pavucontrol)$
windowrule = float match:class ^(nm-connection-editor)$
windowrule = float match:class ^kcalc$
windowrule = float match:class ^(org.kde.polkit-kde-authentication-agent-1)$
windowrule = float match:title ^(Picture-in-Picture)$

# --- Spiele ---------------------------------------------------------
# BEWUSST KEINE Vollbild-Regel fuer steam_appid.
# Die Spiele laufen ueber Gamescope, das sein eigenes Fenster
# steuert. Eine Regel "fullscreen 0" hat Gamescope waehrend des
# Tests das Vollbild wieder abgeschaltet - unter Plasma gibt es
# keine solche Regel, und Hyprland soll sich gleich verhalten.
# (Stand 04.10.2026)
