# ====================================================================
#  input.conf - Tastatur, Maus, Touchpad
#  Angepasst an Hyprland 0.56 (Nox, 04.10.2026)
#  ACHTUNG: Touchpad-Optionen werden in 0.56 mit BINDESTRICH
#  geschrieben (tap-to-click), nicht mit Unterstrich.
# ====================================================================

input {
    # Deutsche Tastatur
    kb_layout = de
    kb_variant = nodeadkeys
    kb_options = compose:ralt

    # Neues Fenster erscheint unter dem Mauszeiger
    follow_mouse = 1

    # Touchpad: kein Beschleunigen, das stoert beim Tippen
    sensitivity = 0
    accel_profile = flat

    numlock_by_default = true

    # Tastenwiederholung
    repeat_rate = 50
    repeat_delay = 350

    touchpad {
        tap-to-click = yes
        tap-and-drag = yes
        natural_scroll = yes
        disable_while_typing = yes
        middle_button_emulation = no
        scroll_factor = 1
    }
}

# Fenster von XWayland-Apps (aeltere Electron-Versionen) mitscannen
device {
    name = ^(Alacritty|code|Code|steam|Steam)$
    kb_layout = de
}