
# ==========================================
# NIGHT CITY // HYPRLAND
# ==========================================

general {
    border_size = 2
    gaps_in = 5
    gaps_out = 10

    col.active_border = rgba(00ff99ee) rgba(bd00ffee) 45deg
    col.inactive_border = rgba(343a4688)
}

decoration {
    rounding = 8

    active_opacity = 0.96
    inactive_opacity = 0.90

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(00ff9c33)
    }

    blur {
        enabled = true
        size = 4
        passes = 2
        vibrancy = 0.12
    }
}

