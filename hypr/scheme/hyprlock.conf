# Farben fuer hyprlock -- erzeugt von `dynamic-island scheme` / `... wallpaper`.
# NICHT von Hand bearbeiten, die Datei wird bei jedem Themewechsel neu
# geschrieben. Das Layout steht in ~/.config/hypr/hyprlock.conf und holt sich
# diese Datei per `source`.

# Flaechen
$background          = rgb(101416)
$surface             = rgb(101416)
$surfaceContainer    = rgb(1d2022)
$surfaceBright       = rgb(363a3c)

# Schrift auf den Flaechen
$onBackground        = rgb(e1e3e5)
$onSurface           = rgb(e1e3e5)
$onSurfaceVariant    = rgb(bfc8ce)

# Linien
$outline             = rgb(8a9298)
$outlineVariant      = rgb(40484d)

# Akzente
$primary             = rgb(daf0ff)
$primaryDim          = rgb(94d7fd)
$onPrimary           = rgb(003549)
$secondary           = rgb(b1cada)
$tertiary            = rgb(ffeace)
$error               = rgb(ffb4ab)
$onError             = rgb(690005)

# Halbtransparente Varianten fuer Karte und Eingabefeld
$surfaceCard         = rgba(101416c0)
$surfaceInner        = rgba(1d2022e6)
$outlineSoft         = rgba(40484d99)
$shadow              = rgba(0000005a)
